# 复制为 config.yaml 后按需修改，也可用环境变量 / CLI 参数覆盖

ai:
  base_url: https://api.openai.com/v1
  api_key: sk-your-key
  model: gpt-4o-mini
  temperature: 0.2
  max_tokens: 4096

mcp:
  # Streamable HTTP 端点，例如 NetBox MCP: http://127.0.0.1:8000/mcp
  url: http://127.0.0.1:8000/mcp
  # 可选：MCP HTTP Bearer Token（对应服务端 MCP_AUTH_TOKEN）
  token: ""
  # 连接/读超时（秒）
  timeout: 30
  sse_read_timeout: 300

agent:
  # 单轮问答最多工具调用轮次，防止死循环
  max_tool_rounds: 8
  # 是否在终端打印工具调用过程
  verbose: true
