<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NetBox AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="app">
    <header class="top">
      <div class="brand-block">
        <div class="brand">NetBox AI</div>
        <p class="tagline">用自然语言查询基础设施真相源</p>
      </div>
      <div class="top-actions">
        <span id="mcpBadge" class="badge">MCP · 检测中</span>
        <button type="button" id="btnReset" class="btn ghost">新对话</button>
      </div>
    </header>

    <main class="stage">
      <section id="welcome" class="welcome">
        <h1>问 NetBox 任何事</h1>
        <p>例如站点设备清单、IP 利用率、变更审计。回答来自 MCP 实时查询，而非模型臆造。连接与提示词请在服务器后台配置。</p>
        <div class="suggestions" id="suggestions">
          <button type="button" data-q="列出所有站点">列出所有站点</button>
          <button type="button" data-q="最近一周有哪些变更记录？">最近一周变更</button>
          <button type="button" data-q="统计各站点的设备数量">各站点设备数量</button>
        </div>
      </section>

      <div id="messages" class="messages" hidden></div>
    </main>

    <footer class="composer">
      <form id="chatForm" class="composer-form">
        <textarea id="input" rows="1" placeholder="用自然语言描述你要查的 NetBox 信息…" autocomplete="off"></textarea>
        <button type="submit" id="btnSend" class="btn primary">发送</button>
      </form>
      <div class="meta-line">
        <span id="modelHint">加载中…</span>
        <span class="sep">·</span>
        <span>v{{ version }}</span>
      </div>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
