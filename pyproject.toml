[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-ai"
version = "0.1.0"
description = "通过 NetBox MCP 进行自然语言查询的 AI 工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0.0",
  "openai>=1.60.0",
  "httpx>=0.27.0",
  "httpx2>=2.5.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "rich>=13.0.0",
  "click>=8.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
]

[project.scripts]
netbox-ai = "netbox_ai.cli:main"

[tool.setuptools.packages.find]
include = ["netbox_ai*"]

[tool.setuptools.package-data]
netbox_ai = ["web/templates/*", "web/static/*"]